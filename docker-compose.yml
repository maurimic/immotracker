version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immotracker-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/immotracker.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME:-Kontoumsätze}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - immo-data:/data
      - immo-uploads:/app/public/uploads
      - immo-backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: immotracker-backup
    restart: unless-stopped
    environment:
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
    volumes:
      - immo-data:/data:ro
      - immo-uploads:/app/public/uploads:ro
      - immo-backups:/backups

volumes:
  immo-data:
  immo-uploads:
  immo-backups:
