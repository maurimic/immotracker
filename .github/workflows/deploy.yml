name: Auto Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy Immotracker on Server
        run: |
          echo "Starting automated deployment on $(hostname)..."
          if [ -d "$HOME/immotracker" ]; then
            cd "$HOME/immotracker"
          elif [ -d "/opt/immotracker" ]; then
            cd "/opt/immotracker"
          else
            echo "Immotracker directory not found!"
            exit 1
          fi
          
          echo "Pulling latest changes from GitHub..."
          git fetch origin main
          git reset --hard origin/main
          
          echo "Building updated Docker images in background..."
          docker compose build
          
          echo "Restarting containers with zero downtime..."
          docker compose up -d --remove-orphans
          
          echo "Deployment completed successfully!"

      - name: Configure Caddy Reverse Proxy for ImmoMetrica
        run: |
          echo "=== Configuring Caddy for immofinder-poggel-micciche.duckdns.org ==="
          if [ -f /etc/caddy/Caddyfile ]; then
            if ! grep -q "immofinder-poggel-micciche.duckdns.org" /etc/caddy/Caddyfile; then
              echo "Adding entry to /etc/caddy/Caddyfile..."
              cat << 'EOF' | sudo tee -a /etc/caddy/Caddyfile

immofinder-poggel-micciche.duckdns.org {
    reverse_proxy 127.0.0.1:8000
}
EOF
              echo "Reloading Caddy..."
              sudo systemctl reload caddy || sudo caddy reload --config /etc/caddy/Caddyfile || true
              echo "Caddy reloaded!"
            else
              echo "Caddyfile already contains immofinder-poggel-micciche.duckdns.org."
            fi
            echo "--- Current Caddyfile ---"
            cat /etc/caddy/Caddyfile
            echo "--- Testing HTTP routing ---"
            sleep 3
            curl -s -i -H "Host: immofinder-poggel-micciche.duckdns.org" http://localhost:80/api/health || true
          else
            echo "/etc/caddy/Caddyfile not found."
          fi
