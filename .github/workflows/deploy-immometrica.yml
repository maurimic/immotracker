name: Deploy ImmoMetrica on Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Configure Caddy Reverse Proxy
        run: |
          echo "=== Configuring Caddy for immofinder-poggel-micciche.duckdns.org ==="
          if ! grep -q "immofinder-poggel-micciche.duckdns.org" /etc/caddy/Caddyfile; then
            echo "Appending block to /etc/caddy/Caddyfile..."
            if sudo -n true 2>/dev/null; then
              sudo tee -a /etc/caddy/Caddyfile << 'EOF'

immofinder-poggel-micciche.duckdns.org {
    reverse_proxy 127.0.0.1:8000
}
EOF
              echo "Reloading Caddy with sudo..."
              sudo systemctl reload caddy || sudo caddy reload --config /etc/caddy/Caddyfile
            elif [ -w /etc/caddy/Caddyfile ]; then
              cat << 'EOF' >> /etc/caddy/Caddyfile

immofinder-poggel-micciche.duckdns.org {
    reverse_proxy 127.0.0.1:8000
}
EOF
              echo "Reloading Caddy directly..."
              caddy reload --config /etc/caddy/Caddyfile || systemctl reload caddy
            else
              echo "Cannot write to /etc/caddy/Caddyfile without sudo. Permissions:"
              ls -la /etc/caddy/Caddyfile
            fi
          else
            echo "immofinder-poggel-micciche.duckdns.org already in Caddyfile."
          fi
          
          echo "=== Updated Caddyfile Contents ==="
          cat /etc/caddy/Caddyfile
          
          echo "=== Testing Local Caddy Routing ==="
          sleep 3
          curl -s -i -H "Host: immofinder-poggel-micciche.duckdns.org" http://localhost:80/api/health || true
