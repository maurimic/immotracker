name: Deploy ImmoMetrica on Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy ImmoMetrica to Server
        run: |
          echo "========================================================"
          echo " Starting ImmoMetrica Deployment on $(hostname)"
          echo " Working directory: $(pwd), User: $(whoami)"
          echo "========================================================"
          
          # Target deployment directory
          TARGET_DIR="$HOME/immometrica"
          if [ -d "/opt/immotracker" ] && [ ! -d "$HOME/immotracker" ]; then
            TARGET_DIR="/opt/immometrica"
          fi
          
          echo "Target directory: $TARGET_DIR"
          
          if [ -d "$TARGET_DIR/.git" ]; then
            echo "Repository exists. Pulling latest main..."
            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main
          else
            echo "Cloning https://github.com/maurimic/immometrica.git into $TARGET_DIR..."
            git clone https://github.com/maurimic/immometrica.git "$TARGET_DIR"
            cd "$TARGET_DIR"
          fi
          
          # Configure .env
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi
          
          # Sync credentials from Immotracker if available
          IMMOTRACKER_ENV=""
          if [ -f "$HOME/immotracker/.env" ]; then
            IMMOTRACKER_ENV="$HOME/immotracker/.env"
          elif [ -f "/opt/immotracker/.env" ]; then
            IMMOTRACKER_ENV="/opt/immotracker/.env"
          fi
          
          if [ -n "$IMMOTRACKER_ENV" ]; then
            echo "Syncing auth credentials from $IMMOTRACKER_ENV..."
            IMMO_USER=$(grep -E "^(APP_USERNAME|ADMIN_USERNAME)=" "$IMMOTRACKER_ENV" | head -n 1 | cut -d '=' -f2- | tr -d '\r"')
            IMMO_PASS=$(grep -E "^(APP_PASSWORD|ADMIN_PASSWORD)=" "$IMMOTRACKER_ENV" | head -n 1 | cut -d '=' -f2- | tr -d '\r"')
            if [ -n "$IMMO_USER" ]; then
              sed -i "s/^APP_USERNAME=.*/APP_USERNAME=$IMMO_USER/" .env
            fi
            if [ -n "$IMMO_PASS" ]; then
              sed -i "s/^APP_PASSWORD=.*/APP_PASSWORD=$IMMO_PASS/" .env
            fi
          fi
          
          echo "Building Docker container..."
          docker compose build
          
          echo "Starting ImmoMetrica container..."
          docker compose up -d --remove-orphans
          
          echo "Waiting 6 seconds for container startup..."
          sleep 6
          
          echo "--- Docker Containers Status ---"
          docker compose ps
          
          echo "--- Verifying Health Check Endpoint ---"
          curl -s -i http://localhost:8000/api/health || echo "Health check curl returned non-zero"
          
          echo "========================================================"
          echo " ImmoMetrica successfully deployed and active! "
          echo "========================================================"
