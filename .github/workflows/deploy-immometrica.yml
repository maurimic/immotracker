name: Deploy ImmoMetrica on Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Inspect and Configure Reverse Proxy
        run: |
          echo "=== 1. Checking Listening Ports on Host ==="
          ss -tlpn || netstat -tlpn || true
          
          echo "=== 2. Checking Active Reverse Proxy Processes ==="
          ps aux | grep -E "nginx|caddy|apache|traefik" | grep -v grep || true
          
          echo "=== 3. Checking Nginx configs ==="
          if [ -d /etc/nginx ]; then
            echo "--- /etc/nginx/sites-enabled/ ---"
            ls -la /etc/nginx/sites-enabled/ || true
            for f in /etc/nginx/sites-enabled/*; do
              if [ -f "$f" ]; then
                echo "FILE: $f"
                cat "$f"
                echo "--------------------"
              fi
            done
          fi
          
          echo "=== 4. Checking Caddy configs ==="
          if [ -f /etc/caddy/Caddyfile ]; then
            cat /etc/caddy/Caddyfile
          fi
          
          echo "=== 5. Checking Firewall status ==="
          which ufw && ufw status || true
          which iptables && iptables -L INPUT -n --line-numbers | head -n 30 || true

      - name: Deploy ImmoMetrica to Server
        run: |
          echo "========================================================"
          echo " Starting ImmoMetrica Deployment on $(hostname)"
          echo "========================================================"
          TARGET_DIR="/opt/immometrica"
          if [ ! -d "$TARGET_DIR" ] && [ -d "$HOME/immometrica" ]; then
            TARGET_DIR="$HOME/immometrica"
          fi
          cd "$TARGET_DIR"
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
          sleep 5
          docker compose ps
          curl -s -i http://localhost:8000/api/health
